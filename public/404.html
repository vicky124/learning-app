<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Learning Hub</title>
    <!--
      GitHub Pages serves this file for any URL with no matching static
      file — i.e. every deep link into this single-page app (e.g.
      /learning-app/basics/jsx). It stashes the real URL in
      sessionStorage and redirects to the app's index.html, whose inline
      script (see index.html) restores it via history.replaceState before
      React Router mounts. Standard technique for SPAs on GitHub Pages.
    -->
    <script>
      sessionStorage.redirect = location.href
    </script>
    <meta http-equiv="refresh" content="0; url=/learning-app/" />
  </head>
  <body></body>
</html>
